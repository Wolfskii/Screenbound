version: "3"

# Windows desktop app. `dev` is the local loop; `release` builds NSIS + MSI +
# portable artifacts into dist/; `deploy` installs the NSIS build for the current user.

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install npm dependencies
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm install

  dev:
    desc: Run the app locally (Vite + Tauri)
    deps: [install]
    interactive: true
    cmds:
      - npm run tauri dev

  dev:logs:
    desc: Run the app locally with engine debug logs
    deps: [install]
    interactive: true
    env:
      RUST_LOG: screenbound_lib=debug
    cmds:
      - npm run tauri dev

  check:
    desc: Frontend type check
    deps: [install]
    cmds:
      - npm run check

  test:
    desc: Rust unit tests
    dir: src-tauri
    cmds:
      - cargo test

  probe:
    desc: Read-only probe of real monitors and windows
    dir: src-tauri
    cmds:
      - cargo test -- --ignored --nocapture

  probe:resize:
    desc: Resize one window and print how its bounds change (PID=)
    requires:
      vars: [PID]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/probe-resize.ps1 -ProcessId {{.PID}}{{if .NOSEND}} -NoSendChanging{{end}}

  lint:
    desc: Clippy on all Rust targets
    dir: src-tauri
    cmds:
      - cargo clippy --all-targets

  ci:
    desc: Typecheck, unit tests, and clippy
    cmds:
      - task: check
      - task: test
      - task: lint

  release:
    aliases: [build]
    desc: Production build — NSIS + MSI installers and a portable exe in dist/
    deps: [install]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stop-screenbound.ps1
      - npm run tauri build
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/publish-artifacts.ps1

  deploy:
    desc: Build release artifacts and install the NSIS setup for the current user
    cmds:
      - task: release
      - powershell -NoProfile -ExecutionPolicy Bypass -Command "$setup = Get-ChildItem -Path 'dist' -Filter '*-setup.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1; if (-not $setup) { throw 'NSIS installer not found under dist/' }; Write-Host ('Installing ' + $setup.FullName); $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru; if ($p.ExitCode -ne 0) { exit $p.ExitCode }"
